<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Theory of Change Explorer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="gate">
    <div class="gate-card">
      <img src="assets/cifar-logo-white.png" alt="CIFAR">
      <h1>Theory of Change <b>Explorer</b></h1>
      <p>Enter the password to view</p>
      <div class="gate-field">
        <input id="gate-input" type="password" placeholder="Password" autocomplete="off">
        <button id="gate-enter" type="button">Enter</button>
      </div>
      <div id="gate-msg" class="gate-msg"></div>
    </div>
  </div>
  <header id="topbar">
    <img id="brandlogo" src="assets/cifar-logo-white.png" alt="CIFAR">
    <span class="divider"></span>
    <h1>Theory of Change <b>Explorer</b></h1>
    <input id="search" list="node-list" placeholder="Search for a node…" autocomplete="off">
    <datalist id="node-list"></datalist>
    <button id="reset" type="button">Reset view</button>
  </header>
  <div id="topaccent"></div>
  <div class="col-label col-left">ACTIVITIES</div>
  <div class="col-label col-right">ULTIMATE OUTCOMES</div>

  <div id="cy"></div>

  <aside id="panel" hidden>
    <button id="panel-close" type="button" aria-label="Close">&times;</button>
    <h2 id="p-name"></h2>
    <span id="p-badge" class="badge"></span>
    <p id="p-desc" class="desc"></p>
    <div id="p-metric" class="metric" hidden>
      <div class="metric-label">How we measure success</div>
      <div id="p-metric-text"></div>
    </div>
    <h3 class="sec">Contributed to by</h3>
    <div id="p-parents"></div>
    <h3 class="sec">Leads to</h3>
    <div id="p-children"></div>
  </aside>

  <div id="legend">
    <div><span class="dot activity"></span> Activity</div>
    <div><span class="dot intermediate"></span> Intermediate effect</div>
    <div><span class="dot outcome"></span> Ultimate outcome</div>
    <div class="sep"></div>
    <div><span class="swatch up"></span> Contributed to by</div>
    <div><span class="swatch down"></span> Leads to</div>
  </div>

  <div id="filterbar">
    <span class="filter-title">PROGRAMS</span>
    <div id="filter-boxes"></div>
  </div>

  <script src="vendor/cytoscape.min.js"></script>
  <script src="vendor/dagre.min.js"></script>
  <script src="vendor/cytoscape-dagre.js"></script>
  <script type="module" src="src/app.mjs"></script>
</body>
</html>
